<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stranger Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #8b2920;
      color: white;
      padding: 18px;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .connection-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1cc88a;
      display: inline-block;
      margin-right: 8px;
    }

    .connection-status.disconnected {
      background: #e74a3b;
      animation: blink 1s infinite;
    }

    .connection-status.reconnecting {
      background: #f6c23e;
      animation: blink 0.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .status {
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 18px;
      margin-bottom: 10px;
      font-size: 14px;
      word-wrap: break-word;
    }

    .sender-name {
      font-size: 11px;
      opacity: 0.7;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .me {
      background: #e74a3b;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .other {
      background: #333;
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #333;
      background: #1a1a1a;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      margin-right: 8px;
    }

    .input-area input[type="text"]::placeholder {
      color: #888;
    }

    .send-btn {
      background: #1cc88a;
      border: none;
      color: white;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .file-btn {
      background: #858796;
      border: none;
      color: white;
      padding: 0 12px;
      border-radius: 20px;
      margin-right: 8px;
      cursor: pointer;
    }

    .emoji-btn {
      background: #f6c23e;
      border: none;
      color: #333;
      padding: 0 12px;
      border-radius: 20px;
      margin-right: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .emoji-picker {
      position: absolute;
      bottom: 60px;
      left: 10px;
      right: 10px;
      background: #2a2a2a;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      display: none;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
    }

    .emoji-picker.show {
      display: block;
    }

    .emoji-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }

    .emoji-tab {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .emoji-tab.active {
      background: #e74a3b;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .emoji-item {
      font-size: 22px;
      padding: 5px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .emoji-item:hover {
      background: #444;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .sticker-item {
      font-size: 40px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sticker-item:hover {
      background: #444;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gif-item {
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gif-item:hover {
      transform: scale(1.05);
    }

    /* Video Call Overlay */
    .call-overlay {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #000;
      z-index: 1001;
      display: none;
      flex-direction: column;
    }

    .call-overlay.active {
      display: flex;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #1a1a1a;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #333;
    }

    .local-video {
      position: absolute;
      bottom: 100px;
      right: 15px;
      width: 120px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      border: 2px solid #fff;
    }

    .call-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn.mute {
      background: #333;
      color: white;
    }

    .control-btn.mute.active {
      background: #e74a3b;
    }

    .control-btn.video-toggle {
      background: #333;
      color: white;
    }

    .control-btn.video-toggle.active {
      background: #e74a3b;
    }

    .control-btn.end-call {
      background: #e74a3b;
      color: white;
    }

    .call-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .header-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .call-btn {
      background: #1cc88a;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 12px;
    }

    .call-btn.video {
      background: #4e73df;
    }

    .call-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .skip-btn {
      background: #f6c23e;
      border: none;
      color: #333;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
    }

    button:active {
      transform: scale(0.95);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .overlay-content {
      text-align: center;
      color: white;
      padding: 30px;
    }

    .overlay-content h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .btn-primary {
      background: #4e73df;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-secondary {
      background: #858796;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .system-message {
      text-align: center;
      padding: 10px;
      margin: 10px 0;
      background: #3d3d00;
      border-radius: 10px;
      font-size: 13px;
      color: #ffeaa7;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div>
        <div><span class="connection-status" id="connectionStatus"></span>Stranger Chat</div>
        <div class="status" id="status">Finding stranger...</div>
      </div>
      <div class="header-buttons">
        <button class="call-btn" onclick="startCall(false)" id="voiceCallBtn" disabled title="Voice Call">🎤</button>
        <button class="call-btn video" onclick="startCall(true)" id="videoCallBtn" disabled title="Video Call">📹</button>
        <button class="skip-btn" onclick="skipStranger()" id="skipBtn" disabled>Skip</button>
      </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*,image/gif" hidden>
      <button class="file-btn" onclick="pickImage()" id="imgBtn" disabled>+</button>
      <button class="emoji-btn" onclick="toggleEmojiPicker()" id="emojiBtn" disabled>😊</button>
      <div class="input-wrapper">
        <div class="emoji-picker" id="emojiPicker">
          <div class="emoji-tabs">
            <button class="emoji-tab active" onclick="showTab('emojis')">😀 Emoji</button>
            <button class="emoji-tab" onclick="showTab('stickers')">🎉 Stickers</button>
            <button class="emoji-tab" onclick="showTab('gifs')">GIF</button>
          </div>
          <div id="emojis" class="emoji-grid"></div>
          <div id="stickers" class="sticker-grid" style="display:none;"></div>
          <div id="gifs" class="gif-grid" style="display:none;"></div>
        </div>
        <input type="text" id="msg" placeholder="Waiting for stranger..." disabled style="width:100%;" />
      </div>
      <button class="send-btn" onclick="sendMessage()" id="sendBtn" disabled>Send</button>
    </div>

  </div>

  <!-- Video Call Overlay -->
  <div class="call-overlay" id="callOverlay">
    <div class="video-container">
      <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
      <video class="local-video" id="localVideo" autoplay playsinline muted></video>
      <div class="call-status" id="callStatus">Calling...</div>
      <div class="call-controls">
        <button class="control-btn mute active" id="muteBtn" onclick="toggleMute()">🎤</button>
        <button class="control-btn video-toggle" id="videoBtn" onclick="toggleVideo()">📹</button>
        <button class="control-btn end-call" onclick="endCall()">📞</button>
      </div>
    </div>
  </div>

  <!-- Searching Overlay -->
  <div class="overlay" id="searchOverlay">
    <div class="overlay-content">
      <h2>Finding a stranger...</h2>
      <div class="spinner"></div>
      <p>Please wait while we connect you</p>
      <button class="btn-secondary" onclick="cancelSearch()">Cancel</button>
    </div>
  </div>

  <!-- Disconnected Overlay -->
  <div class="overlay hidden" id="disconnectOverlay">
    <div class="overlay-content">
      <h2>Stranger Disconnected</h2>
      <p>The stranger has left the chat</p>
      <button class="btn-primary" onclick="findNewStranger()">Find New Stranger</button>
      <button class="btn-secondary" onclick="goHome()">Go Home</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000
    });
    const chat = document.getElementById("chat");
    const msgInput = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");
    const imgBtn = document.getElementById("imgBtn");
    const emojiBtn = document.getElementById("emojiBtn");
    const skipBtn = document.getElementById("skipBtn");
    const voiceCallBtn = document.getElementById("voiceCallBtn");
    const videoCallBtn = document.getElementById("videoCallBtn");
    const status = document.getElementById("status");
    const connectionStatus = document.getElementById("connectionStatus");
    const searchOverlay = document.getElementById("searchOverlay");
    const disconnectOverlay = document.getElementById("disconnectOverlay");

    let currentRoomId = null;
    let partnerName = "Stranger";
    let myUsername = "You";
    let wasConnected = false;

    // Connection status handling
    socket.on("connect", () => {
      console.log("Socket connected");
      connectionStatus.className = "connection-status";
      connectionStatus.title = "Connected";

      // Load saved username
      const savedUsername = localStorage.getItem('chatUsername');
      if (savedUsername) {
        myUsername = savedUsername;
        socket.emit('set-username', savedUsername);
      }

      // If we were previously connected and searching, restart search
      if (!wasConnected) {
        socket.emit("find-stranger");
        wasConnected = true;
      }
    });

    socket.on("disconnect", () => {
      console.log("Socket disconnected");
      connectionStatus.className = "connection-status disconnected";
      connectionStatus.title = "Disconnected - Reconnecting...";
    });

    socket.on("reconnecting", () => {
      connectionStatus.className = "connection-status reconnecting";
      connectionStatus.title = "Reconnecting...";
    });

    socket.on("reconnect", () => {
      console.log("Socket reconnected");
      connectionStatus.className = "connection-status";
      connectionStatus.title = "Connected";

      // Rejoin room if we had one
      if (currentRoomId) {
        socket.emit("join-room", currentRoomId);
      }
    });

    socket.on("user-info", (user) => {
      myUsername = user.username;
    });

    socket.on("searching-stranger", () => {
      searchOverlay.classList.remove("hidden");
      status.innerText = "Searching...";
    });

    socket.on("stranger-found", (data) => {
      currentRoomId = data.roomId;
      partnerName = data.partnerName;
      searchOverlay.classList.add("hidden");
      status.innerText = `Chatting with ${partnerName}`;

      // Enable chat
      msgInput.disabled = false;
      msgInput.placeholder = "Type message...";
      sendBtn.disabled = false;
      imgBtn.disabled = false;
      emojiBtn.disabled = false;
      skipBtn.disabled = false;
      voiceCallBtn.disabled = false;
      videoCallBtn.disabled = false;

      // Add welcome message
      addSystemMessage(`Connected to ${partnerName}`);
    });

    socket.on("stranger-disconnected", () => {
      disconnectOverlay.classList.remove("hidden");
      status.innerText = "Disconnected";
      disableChat();
    });

    socket.on("stranger-skipped", () => {
      chat.innerHTML = "";
      socket.emit("find-stranger");
      searchOverlay.classList.remove("hidden");
      disableChat();
    });

    socket.on("search-stopped", () => {
      goHome();
    });

    function disableChat() {
      msgInput.disabled = true;
      msgInput.placeholder = "Chat ended";
      sendBtn.disabled = true;
      imgBtn.disabled = true;
      emojiBtn.disabled = true;
      skipBtn.disabled = true;
      voiceCallBtn.disabled = true;
      videoCallBtn.disabled = true;
      endCall();
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addSystemMessage(text) {
      const div = document.createElement("div");
      div.classList.add("system-message");
      div.innerText = text;
      chat.appendChild(div);
      scrollToBottom();
    }

    function sendMessage() {
      const message = msgInput.value.trim();
      if (!message || !currentRoomId) return;

      socket.emit("chat-message", { roomId: currentRoomId, message });
      msgInput.value = "";
    }

    function skipStranger() {
      if (confirm("Skip this stranger and find another?")) {
        socket.emit("skip-stranger");
      }
    }

    function cancelSearch() {
      socket.emit("stop-searching");
    }

    function findNewStranger() {
      disconnectOverlay.classList.add("hidden");
      chat.innerHTML = "";
      socket.emit("find-stranger");
      searchOverlay.classList.remove("hidden");
    }

    function goHome() {
      window.location.href = "/";
    }

    socket.on("chat-message", (data) => {
      const div = document.createElement("div");
      div.classList.add("message");

      const isMe = data.sender === socket.id;
      div.classList.add(isMe ? "me" : "other");

      if (!isMe) {
        const nameDiv = document.createElement("div");
        nameDiv.classList.add("sender-name");
        nameDiv.innerText = partnerName;
        div.appendChild(nameDiv);
      }

      const textDiv = document.createElement("div");
      textDiv.innerText = data.message;
      div.appendChild(textDiv);

      chat.appendChild(div);
      scrollToBottom();
    });

    function pickImage() {
      document.getElementById("imageInput").click();
    }

    function generateId() {
      return "img_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    }

    // Send image
    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file || !currentRoomId) return;

      const reader = new FileReader();
      reader.onload = function () {
        const imageId = generateId();

        socket.emit("send-image", {
          roomId: currentRoomId,
          image: reader.result,
          imageId: imageId
        });
      };
      reader.readAsDataURL(file);
      this.value = "";
    });

    // Receive image
    socket.on("receive-image", (data) => {
      const div = document.createElement("div");
      div.classList.add("message");

      const isMe = data.sender === socket.id;
      div.classList.add(isMe ? "me" : "other");
      div.dataset.id = data.imageId;

      if (!isMe) {
        const nameDiv = document.createElement("div");
        nameDiv.classList.add("sender-name");
        nameDiv.innerText = partnerName;
        div.appendChild(nameDiv);
      }

      const img = document.createElement("img");
      img.src = data.image;
      div.appendChild(img);

      if (isMe) {
        const delBtn = document.createElement("button");
        delBtn.innerText = "Delete";
        delBtn.style.marginTop = "6px";
        delBtn.style.background = "#e74a3b";
        delBtn.style.color = "white";
        delBtn.style.border = "none";
        delBtn.style.padding = "6px 12px";
        delBtn.style.borderRadius = "10px";

        delBtn.onclick = function () {
          socket.emit("delete-image", {
            roomId: currentRoomId,
            imageId: data.imageId
          });
        };

        div.appendChild(delBtn);
      }

      chat.appendChild(div);
      scrollToBottom();
    });

    // REMOVE IMAGE ON ALL CLIENTS
    socket.on("remove-image", (imageId) => {
      const el = chat.querySelector(`[data-id='${imageId}']`);
      if (el) el.remove();
    });

    // Enter key to send
    msgInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    // Emoji/Sticker Picker
    const emojis = ['😀','😁','😂','🤣','😃','😄','😅','😆','😉','😊','😋','😎','😍','😘','🥰','😗','😙','🥲','😚','☺️','🙂','🤗','🤩','🤔','🤨','😐','😑','😶','🙄','😏','😣','😥','😮','🤐','😯','😪','😫','🥱','😴','😌','😛','😜','😝','🤤','😒','😓','😔','😕','🙃','🤑','😲','☹️','🙁','😖','😞','😟','😤','😢','😭','😦','😧','😨','😩','🤯','😬','😰','😱','🥵','🥶','😳','🤪','😵','🥴','😠','😡','🤬','😷','🤒','🤕','🤢','🤮','🤧','😇','🥳','🥺','🤠','🤡','🤥','🤫','🤭','🧐','🤓','😈','👿','👋','🤚','🖐️','✋','🖖','👌','🤌','🤏','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍','👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🤝','🙏','✍️','💪','🦾','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟'];
    const stickersData = ['🎉','🎊','🎈','🎁','🏆','⭐','🌟','✨','💫','🔥','💥','💯','🎯','🚀','💎','👑','🦄','🐱','🐶','🐼','🦊','🦁','🐯','🐸','🐵','🙈','🙉','🙊','💀','👻','👽','🤖','💩','🎃','🌈','☀️','🌙','⚡','❄️','🌊','🌸','🌺','🍀','🍕','🍔','🍟','🍩','🍪','🎂','🍰','☕','🍺','🥂','🎵','🎶','🎸','🎮','🎲','⚽','🏀','🎾','🏈'];

    const emojiGrid = document.getElementById('emojis');
    const stickerGrid = document.getElementById('stickers');
    const emojiPicker = document.getElementById('emojiPicker');

    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'emoji-item';
      span.innerText = emoji;
      span.onclick = () => insertEmoji(emoji);
      emojiGrid.appendChild(span);
    });

    stickersData.forEach(sticker => {
      const span = document.createElement('span');
      span.className = 'sticker-item';
      span.innerText = sticker;
      span.onclick = () => sendSticker(sticker);
      stickerGrid.appendChild(span);
    });

    function toggleEmojiPicker() {
      emojiPicker.classList.toggle('show');
    }

    function showTab(tab) {
      document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('emojis').style.display = tab === 'emojis' ? 'grid' : 'none';
      document.getElementById('stickers').style.display = tab === 'stickers' ? 'grid' : 'none';
      document.getElementById('gifs').style.display = tab === 'gifs' ? 'grid' : 'none';
    }

    function insertEmoji(emoji) {
      msgInput.value += emoji;
      msgInput.focus();
    }

    function sendSticker(sticker) {
      if (!currentRoomId) return;
      socket.emit("chat-message", { roomId: currentRoomId, message: sticker });
      emojiPicker.classList.remove('show');
    }

    // Close emoji picker when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.emoji-picker') && !e.target.closest('.emoji-btn')) {
        emojiPicker.classList.remove('show');
      }
    });

    // GIF Support
    const gifs = [
      'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
      'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',
      'https://media.giphy.com/media/3o7TKSjRrfIPjeiVyg/giphy.gif',
      'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
      'https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif',
      'https://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif',
      'https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif',
      'https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif',
      'https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif',
      'https://media.giphy.com/media/l4FGGafcOHmrlQxG0/giphy.gif',
      'https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif',
      'https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif'
    ];

    const gifGrid = document.getElementById('gifs');
    gifs.forEach(gif => {
      const img = document.createElement('img');
      img.className = 'gif-item';
      img.src = gif;
      img.onclick = () => sendGif(gif);
      gifGrid.appendChild(img);
    });

    function sendGif(gifUrl) {
      if (!currentRoomId) return;
      const imageId = generateId();
      socket.emit("send-image", {
        roomId: currentRoomId,
        image: gifUrl,
        imageId: imageId
      });
      emojiPicker.classList.remove('show');
    }

    // WebRTC Video/Voice Call
    let localStream = null;
    let peerConnection = null;
    let isMuted = true; // Default muted
    let isVideoOff = false;
    let isVideoCall = false;

    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startCall(withVideo) {
      if (!currentRoomId) return;
      isVideoCall = withVideo;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: withVideo
        });

        // Default muted
        localStream.getAudioTracks().forEach(track => track.enabled = false);
        isMuted = true;
        document.getElementById('muteBtn').classList.add('active');

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');
        document.getElementById('callStatus').innerText = 'Calling...';

        if (!withVideo) {
          document.getElementById('localVideo').style.display = 'none';
          document.getElementById('videoBtn').style.display = 'none';
        } else {
          document.getElementById('localVideo').style.display = 'block';
          document.getElementById('videoBtn').style.display = 'flex';
        }

        createPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { roomId: currentRoomId, offer, isVideoCall: withVideo });
      } catch (err) {
        console.error('Error starting call:', err);
        alert('Could not access camera/microphone');
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(config);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        document.getElementById('callStatus').innerText = 'Connected';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { roomId: currentRoomId, candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected') {
          endCall();
        }
      };
    }

    socket.on('call-made', async (data) => {
      if (confirm('Incoming ' + (data.isVideoCall ? 'video' : 'voice') + ' call. Accept?')) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: data.isVideoCall
          });

          // Default muted
          localStream.getAudioTracks().forEach(track => track.enabled = false);
          isMuted = true;
          document.getElementById('muteBtn').classList.add('active');

          document.getElementById('localVideo').srcObject = localStream;
          document.getElementById('callOverlay').classList.add('active');

          if (!data.isVideoCall) {
            document.getElementById('localVideo').style.display = 'none';
            document.getElementById('videoBtn').style.display = 'none';
          } else {
            document.getElementById('localVideo').style.display = 'block';
            document.getElementById('videoBtn').style.display = 'flex';
          }

          createPeerConnection();

          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          socket.emit('make-answer', { roomId: currentRoomId, answer });
          document.getElementById('callStatus').innerText = 'Connected';
        } catch (err) {
          console.error('Error answering call:', err);
        }
      } else {
        socket.emit('call-rejected', { roomId: currentRoomId });
      }
    });

    socket.on('answer-made', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById('callStatus').innerText = 'Connected';
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('call-rejected', () => {
      alert('Call was rejected');
      endCall();
    });

    socket.on('call-ended', () => {
      endCall();
    });

    function toggleMute() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        document.getElementById('muteBtn').classList.toggle('active', isMuted);
      }
    }

    function toggleVideo() {
      if (localStream) {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
        document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
      }
    }

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('callOverlay').classList.remove('active');
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = null;
      if (currentRoomId) {
        socket.emit('end-call', { roomId: currentRoomId });
      }
    }

  </script>

</body>

</html>
