<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MindFresh Chat</title>

  <style>
    :root {
      color-scheme: dark;
      color: #f5f5f5;
      background: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background: #000;
      color: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
    }

    .card {
      width: 100%;
      background: #000;
      border: 1px solid #1a1a1a;
      border-radius: 16px;
      padding: 32px 24px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
      font-size: 13px;
      line-height: 1.5;
    }

    .section {
      margin-bottom: 20px;
    }

    .section-title {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #f5f5f5;
      font-size: 13px;
      transition: border-color 0.2s ease;
    }

    input[type="text"]::placeholder {
      color: #666;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #555;
      background: #121212;
    }

    .btn {
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #111;
      color: #f5f5f5;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      width: 100%;
    }

    .btn:hover {
      background: #1a1a1a;
      border-color: #444;
    }

    .btn:active {
      background: #252525;
    }

    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
    }

    .input-group .btn {
      width: auto;
      padding: 12px 16px;
    }

    .feature-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      margin-top: 20px;
    }

    .feature {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 12px;
      color: #aaa;
      line-height: 1.4;
    }

    .feature-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    @media (max-width: 520px) {
      .card {
        padding: 24px 18px;
      }

      h1 {
        font-size: 24px;
      }

      .input-group {
        flex-direction: column;
      }

      .input-group .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>MindFresh</h1>
      <p class="subtitle">Connect with anyone, instantly</p>

      <div class="section">
        <div class="section-title">Username (optional)</div>
        <input type="text" id="usernameInput" placeholder="Choose a name..." />
      </div>

      <div class="section">
        <div class="section-title">Join Room</div>
        <div class="input-group">
          <input type="text" id="roomInput" placeholder="Enter room code..." />
          <button class="btn" onclick="joinRoom()">Join</button>
        </div>
      </div>

      <div class="feature-list">
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>Real-time video and audio</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>Share images and messages</span>
        </div>
        <div class="feature">
          <span class="feature-icon">✓</span>
          <span>End-to-end communication</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Generate and save username
    let savedUsername = localStorage.getItem('chatUsername');
    if (savedUsername) {
      document.getElementById('usernameInput').value = savedUsername;
    }

    // Initialize video toggle
    let videoEnabled = localStorage.getItem('roomVideoEnabled') !== 'false'; // Default to true
    updateVideoToggleBtn();

    // Save username when typing
    document.getElementById('usernameInput').addEventListener('input', (e) => {
      const username = e.target.value.trim();
      if (username) {
        localStorage.setItem('chatUsername', username);
        socket.emit('set-username', username);
      }
    });

    function updateVideoToggleBtn() {
      const btn = document.getElementById('videoToggleBtn');
      btn.textContent = videoEnabled ? 'Video On' : 'Video Off';
      btn.className = videoEnabled ? 'btn btn-outline' : 'btn btn-secondary';
    }

    function toggleVideo() {
      videoEnabled = !videoEnabled;
      localStorage.setItem('roomVideoEnabled', videoEnabled);
      updateVideoToggleBtn();
    }

    function startStrangerChat() {
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        localStorage.setItem('chatUsername', username);
        socket.emit('set-username', username);
      }
      window.location.href = "/stranger.html";
    }

    function createRoom() {
      socket.emit("create-room");
    }

    function joinRoom() {
      const roomId = document.getElementById("roomInput").value.trim();
      if (!roomId) {
        alert("Please enter a room code");
        return;
      }
      window.location.href = `/room.html?room=${roomId}`;
    }

    socket.on("room-created", (roomId) => {
      window.location.href = `/room.html?room=${roomId}`;
    });

    // Allow enter key to join room
    document.getElementById("roomInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        joinRoom();
      }
    });
  </script>

</body>

</html>
