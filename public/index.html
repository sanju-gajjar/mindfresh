<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MindFresh Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      color: #fff;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 40px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #e74a3b, #d63384);
      color: white;
      box-shadow: 0 4px 15px rgba(231, 74, 59, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(231, 74, 59, 0.5);
    }

    .btn-secondary {
      background: #4e73df;
      color: white;
    }

    .btn-outline {
      background: white;
      color: #4e73df;
      border: 2px solid #4e73df;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #333;
      border-radius: 10px;
      font-size: 14px;
      transition: border 0.3s;
      background: #2a2a2a;
      color: #fff;
    }

    input[type="text"]::placeholder {
      color: #888;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #4e73df;
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #666;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #333;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      color: #aaa;
      font-size: 13px;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 15px;
      }

      .card {
        padding: 30px 20px;
      }

      h1 {
        font-size: 28px;
      }

      .btn {
        padding: 14px;
        font-size: 15px;
      }

      .input-group {
        flex-direction: column;
        gap: 8px;
      }

      .input-group button {
        width: 100%;
        padding: 14px;
      }

      input[type="text"] {
        padding: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">
      <h1>MindFresh</h1>
      <p class="subtitle">Connect instantly with people around the world</p>

      <div class="section">
        <div class="section-title">👤 Your Username</div>
        <input type="text" id="usernameInput" placeholder="Enter your name..." style="width: 100%; margin-bottom: 20px;" />
      </div>

      <div class="section">
        <div class="section-title">🎲 Random Chat</div>
        <button class="btn btn-primary" onclick="startStrangerChat()">
          Chat with Random Stranger
        </button>
        <div class="feature">
          <div class="feature-icon">⚡</div>
          <span>Instant anonymous connections</span>
        </div>
        <div class="feature">
          <div class="feature-icon">⏭️</div>
          <span>Skip to next stranger anytime</span>
        </div>
      </div>

      <div class="divider">OR</div>

      <div class="section">
        <div class="section-title">🏠 Private Rooms</div>
        <button class="btn btn-secondary" onclick="createRoom()">
          Create New Room
        </button>

        <div class="input-group">
          <input type="text" id="roomInput" placeholder="Enter room code..." />
          <button class="btn btn-outline" onclick="toggleVideo()" id="videoToggleBtn" style="width: auto; padding: 12px 16px; margin: 0;">
            Video On
          </button>
          <button class="btn btn-secondary" onclick="joinRoom()" style="width: auto; padding: 12px 24px; margin: 0;">
            Join
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Generate and save username
    let savedUsername = localStorage.getItem('chatUsername');
    if (savedUsername) {
      document.getElementById('usernameInput').value = savedUsername;
    }

    // Initialize video toggle
    let videoEnabled = localStorage.getItem('roomVideoEnabled') !== 'false'; // Default to true
    updateVideoToggleBtn();

    // Save username when typing
    document.getElementById('usernameInput').addEventListener('input', (e) => {
      const username = e.target.value.trim();
      if (username) {
        localStorage.setItem('chatUsername', username);
        socket.emit('set-username', username);
      }
    });

    function updateVideoToggleBtn() {
      const btn = document.getElementById('videoToggleBtn');
      btn.textContent = videoEnabled ? 'Video On' : 'Video Off';
      btn.className = videoEnabled ? 'btn btn-outline' : 'btn btn-secondary';
    }

    function toggleVideo() {
      videoEnabled = !videoEnabled;
      localStorage.setItem('roomVideoEnabled', videoEnabled);
      updateVideoToggleBtn();
    }

    function startStrangerChat() {
      const username = document.getElementById('usernameInput').value.trim();
      if (username) {
        localStorage.setItem('chatUsername', username);
        socket.emit('set-username', username);
      }
      window.location.href = "/stranger.html";
    }

    function createRoom() {
      socket.emit("create-room");
    }

    function joinRoom() {
      const roomId = document.getElementById("roomInput").value.trim();
      if (!roomId) {
        alert("Please enter a room code");
        return;
      }
      window.location.href = `/room.html?room=${roomId}`;
    }

    socket.on("room-created", (roomId) => {
      window.location.href = `/room.html?room=${roomId}`;
    });

    // Allow enter key to join room
    document.getElementById("roomInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        joinRoom();
      }
    });
  </script>

</body>

</html>
