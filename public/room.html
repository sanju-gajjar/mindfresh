<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat Room</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Söhne', 'Segoe UI', 'SF Pro Display', -apple-system, sans-serif;
    }

    body {
      height: 100vh;
      background: #212121;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: #212121;
      display: flex;
      flex-direction: column;
    }

    /* ChatGPT-style Header */
    .header {
      background: #2f2f2f;
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #444;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: #ececec;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: #444;
    }

    .room-info {
      display: flex;
      flex-direction: column;
    }

    .room-title {
      font-size: 16px;
      font-weight: 600;
      color: #ececec;
    }

    .room-subtitle {
      font-size: 12px;
      color: #8e8e8e;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10a37f;
    }

    .connection-dot.disconnected {
      background: #ef4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: #3a3a3a;
      border: none;
      color: #ececec;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-btn:hover {
      background: #4a4a4a;
    }

    /* Members Bar */
    .members-bar {
      background: #2a2a2a;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #383838;
      flex-wrap: wrap;
    }

    .members-label {
      color: #8e8e8e;
      font-size: 12px;
      font-weight: 500;
    }

    .member-chip {
      background: #383838;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #ececec;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .member-chip.owner {
      background: #10a37f;
      color: white;
    }

    .member-chip.you {
      border: 1px solid #10a37f;
    }

    .member-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
    }

    .member-status.online {
      background: #10a37f;
    }

    .kick-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      cursor: pointer;
      margin-left: 6px;
    }

    .waiting-text {
      color: #6b7280;
      font-size: 13px;
      font-style: italic;
    }

    /* Join Requests Panel */
    .join-requests {
      background: #3a3a3a;
      padding: 12px 20px;
      border-bottom: 1px solid #444;
      display: none;
    }

    .join-requests.show {
      display: block;
    }

    .join-request-title {
      color: #f59e0b;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .request-item {
      background: #2a2a2a;
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .request-user {
      color: #ececec;
      font-size: 14px;
    }

    .request-actions {
      display: flex;
      gap: 8px;
    }

    .approve-btn {
      background: #10a37f;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    .reject-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }

    /* Chat Area - ChatGPT Style */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-group.me {
      align-items: flex-end;
    }

    .message-group.other {
      align-items: flex-start;
    }

    .sender-name {
      font-size: 12px;
      color: #8e8e8e;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
      position: relative;
    }

    .message.me {
      background: #10a37f;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      background: #3a3a3a;
      color: #ececec;
      border-bottom-left-radius: 4px;
    }

    .message img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }

    /* Message Status Ticks */
    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      justify-content: flex-end;
    }

    .message-time {
      font-size: 10px;
    }

    .message-status {
      display: flex;
      align-items: center;
    }

    .tick {
      font-size: 14px;
    }

    .tick.sent {
      color: rgba(255, 255, 255, 0.5);
    }

    .tick.delivered {
      color: rgba(255, 255, 255, 0.7);
    }

    .tick.read {
      color: #34d399;
    }

    /* Message Reactions */
    .message-wrapper {
      position: relative;
    }

    .message-wrapper:hover .reaction-trigger {
      opacity: 1;
    }

    .reaction-trigger {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #2f2f2f;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 4px 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      font-size: 14px;
      z-index: 10;
    }

    .message-wrapper.me .reaction-trigger {
      left: -40px;
    }

    .message-wrapper.other .reaction-trigger {
      right: -40px;
    }

    .reaction-trigger:hover {
      background: #3a3a3a;
    }

    .reaction-picker {
      position: absolute;
      top: -50px;
      background: #2f2f2f;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 6px 10px;
      display: none;
      gap: 4px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 100;
    }

    .message-wrapper.me .reaction-picker {
      right: 0;
    }

    .message-wrapper.other .reaction-picker {
      left: 0;
    }

    .reaction-picker.show {
      display: flex;
    }

    .reaction-picker span {
      font-size: 20px;
      padding: 4px 6px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.15s;
    }

    .reaction-picker span:hover {
      background: #444;
      transform: scale(1.2);
    }

    .reactions-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .reaction-badge {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reaction-badge:hover {
      background: #3a3a3a;
      border-color: #555;
    }

    .reaction-badge.mine {
      background: rgba(16, 163, 127, 0.2);
      border-color: #10a37f;
    }

    .reaction-badge .emoji {
      font-size: 14px;
    }

    .reaction-badge .count {
      color: #8e8e8e;
      font-size: 12px;
    }

    .reaction-badge.mine .count {
      color: #10a37f;
    }

    .reaction-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: #ececec;
      white-space: nowrap;
      display: none;
      z-index: 200;
      margin-bottom: 4px;
    }

    .reaction-badge:hover .reaction-tooltip {
      display: block;
    }

    /* Typing Indicator */
    .typing-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #3a3a3a;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      max-width: fit-content;
      margin-bottom: 10px;
    }

    .typing-indicator.show {
      display: flex;
    }

    .typing-text {
      color: #8e8e8e;
      font-size: 13px;
      font-style: italic;
    }

    .typing-dots {
      display: flex;
      gap: 3px;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #8e8e8e;
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {

      0%,
      60%,
      100% {
        transform: translateY(0);
      }

      30% {
        transform: translateY(-4px);
      }
    }

    /* Input Area - ChatGPT Style */
    .input-container {
      padding: 16px 20px;
      background: #212121;
    }

    .input-area {
      background: #2f2f2f;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.2s;
    }

    .input-area:focus-within {
      border-color: #10a37f;
    }

    .input-actions {
      display: flex;
      gap: 6px;
    }

    .input-btn {
      background: none;
      border: none;
      color: #8e8e8e;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .input-btn:hover {
      background: #444;
      color: #ececec;
    }

    #msg {
      flex: 1;
      background: transparent;
      border: none;
      color: #ececec;
      font-size: 15px;
      outline: none;
    }

    #msg::placeholder {
      color: #6b7280;
    }

    .send-btn {
      background: #10a37f;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .send-btn:hover {
      background: #0d8b6a;
    }

    .send-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    /* Emoji Picker */
    .emoji-picker {
      position: absolute;
      bottom: 80px;
      left: 20px;
      right: 20px;
      background: #2f2f2f;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: none;
      max-height: 300px;
      overflow-y: auto;
      z-index: 100;
    }

    .emoji-picker.show {
      display: block;
    }

    .emoji-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #444;
      padding-bottom: 10px;
    }

    .emoji-tab {
      padding: 8px 14px;
      background: #3a3a3a;
      border: none;
      border-radius: 8px;
      color: #ececec;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .emoji-tab.active {
      background: #10a37f;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }

    .emoji-item {
      font-size: 24px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .emoji-item:hover {
      background: #444;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .sticker-item {
      font-size: 40px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sticker-item:hover {
      background: #444;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gif-item {
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gif-item:hover {
      transform: scale(1.03);
    }

    /* System Messages */
    .system-message {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 8px 0;
    }

    /* Video Call Overlay */
    .call-overlay {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .call-overlay.active {
      display: flex;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #1a1a1a;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #333;
    }

    .local-video {
      position: absolute;
      bottom: 100px;
      right: 20px;
      width: 140px;
      height: 180px;
      border-radius: 16px;
      object-fit: cover;
      background: #222;
      border: 3px solid #10a37f;
    }

    .call-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }

    .control-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .control-btn.mute {
      background: #3a3a3a;
      color: white;
    }

    .control-btn.mute.active {
      background: #ef4444;
    }

    .control-btn.video-toggle {
      background: #3a3a3a;
      color: white;
    }

    .control-btn.video-toggle.active {
      background: #ef4444;
    }

    .control-btn.end-call {
      background: #ef4444;
      color: white;
    }

    .call-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 20px;
    }

    /* Incoming Call Modal */
    .incoming-call-modal {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1002;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .incoming-call-modal.active {
      display: flex;
    }

    .incoming-call-content {
      text-align: center;
      color: white;
    }

    .incoming-call-content h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .incoming-call-content p {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .incoming-call-icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: ring 1s infinite;
    }

    @keyframes ring {

      0%,
      100% {
        transform: rotate(-10deg);
      }

      50% {
        transform: rotate(10deg);
      }
    }

    .incoming-call-buttons {
      display: flex;
      gap: 40px;
    }

    .incoming-call-buttons button {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 28px;
      transition: transform 0.2s;
    }

    .incoming-call-buttons button:hover {
      transform: scale(1.1);
    }

    .accept-call {
      background: #10a37f;
      color: white;
    }

    .reject-call {
      background: #ef4444;
      color: white;
    }

    /* Pending Request Screen */
    .pending-screen {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 800px;
      height: 100vh;
      background: #212121;
      z-index: 900;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pending-screen.show {
      display: flex;
    }

    .pending-content {
      text-align: center;
      color: #ececec;
    }

    .pending-icon {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .pending-title {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .pending-subtitle {
      color: #8e8e8e;
      font-size: 15px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #444;
      border-top-color: #10a37f;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Delete button for own images */
    .delete-img-btn {
      margin-top: 8px;
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .message {
        max-width: 85%;
      }

      .header {
        padding: 10px 14px;
      }

      .input-container {
        padding: 12px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="window.location.href='/'">←</button>
        <div class="room-info">
          <div class="room-title">Room: <span id="roomCode"></span></div>
          <div class="room-subtitle">
            <span class="connection-dot" id="connectionDot"></span>
            <span id="connectionText">Connected</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" onclick="startCall(false)">🎤 Voice</button>
        <button class="action-btn" onclick="startCall(true)">📹 Video</button>
      </div>
    </div>

    <!-- Members Bar -->
    <div class="members-bar" id="membersBar">
      <span class="members-label">Members:</span>
      <span class="waiting-text">Waiting for others...</span>
    </div>

    <!-- Join Requests (Owner Only) -->
    <div class="join-requests" id="joinRequests">
      <div class="join-request-title">
        🔔 Join Requests
      </div>
      <div id="requestsList"></div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chat">
      <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>
        <span class="typing-text" id="typingText">Someone is typing...</span>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-container">
      <div class="input-area">
        <div class="input-actions">
          <input type="file" id="imageInput" accept="image/*,image/gif" hidden>
          <button class="input-btn" onclick="pickImage()">📎</button>
          <button class="input-btn" onclick="toggleEmojiPicker()">😊</button>
        </div>
        <input type="text" id="msg" placeholder="Message..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Emoji Picker -->
    <div class="emoji-picker" id="emojiPicker">
      <div class="emoji-tabs">
        <button class="emoji-tab active" onclick="showTab('emojis')">😀 Emoji</button>
        <button class="emoji-tab" onclick="showTab('stickers')">🎉 Stickers</button>
        <button class="emoji-tab" onclick="showTab('gifs')">GIF</button>
      </div>
      <div id="emojis" class="emoji-grid"></div>
      <div id="stickers" class="sticker-grid" style="display:none;"></div>
      <div id="gifs" class="gif-grid" style="display:none;"></div>
    </div>

  </div>

  <!-- Pending Join Request Screen -->
  <div class="pending-screen" id="pendingScreen">
    <div class="pending-content">
      <div class="pending-icon">🚪</div>
      <div class="pending-title">Requesting to Join</div>
      <div class="pending-subtitle">Waiting for room owner to approve...</div>
      <div class="spinner"></div>
      <button class="action-btn" onclick="cancelJoinRequest()" style="margin-top: 20px;">Cancel</button>
    </div>
  </div>

  <!-- Video Call Overlay -->
  <div class="call-overlay" id="callOverlay">
    <div class="video-container">
      <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
      <video class="local-video" id="localVideo" autoplay playsinline muted></video>
      <div class="call-status" id="callStatus">Calling...</div>
      <div class="call-controls">
        <button class="control-btn mute active" id="muteBtn" onclick="toggleMute()">🎤</button>
        <button class="control-btn video-toggle" id="videoBtn" onclick="toggleVideo()">📹</button>
        <button class="control-btn end-call" onclick="endCall()">📞</button>
      </div>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div class="incoming-call-modal" id="incomingCallModal">
    <div class="incoming-call-content">
      <div class="incoming-call-icon" id="incomingCallIcon">📹</div>
      <h2>Incoming Call</h2>
      <p id="incomingCallType">Video Call</p>
      <div class="incoming-call-buttons">
        <button class="reject-call" onclick="rejectIncomingCall()">✕</button>
        <button class="accept-call" onclick="acceptIncomingCall()">✓</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000
    });

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room");
    const chat = document.getElementById("chat");
    const connectionDot = document.getElementById("connectionDot");
    const connectionText = document.getElementById("connectionText");
    const typingIndicator = document.getElementById("typingIndicator");
    const typingText = document.getElementById("typingText");

    let loadedMessageIds = new Set();
    let messageStatuses = {}; // Track message statuses
    let isOwner = false;
    let ownerId = null;
    let typingTimeout = null;
    let pendingRequest = false;

    document.getElementById("roomCode").innerText = roomId;

    // Connection handling
    socket.on("connect", () => {
      connectionDot.classList.remove("disconnected");
      connectionText.innerText = "Connected";
      socket.emit("join-room", roomId);
    });

    socket.on("disconnect", () => {
      connectionDot.classList.add("disconnected");
      connectionText.innerText = "Reconnecting...";
    });

    socket.on("reconnect", () => {
      connectionDot.classList.remove("disconnected");
      connectionText.innerText = "Connected";
    });

    // Room events
    socket.on("room-joined", (rid) => {
      pendingRequest = false;
      document.getElementById("pendingScreen").classList.remove("show");
    });

    socket.on("join-request-sent", () => {
      pendingRequest = true;
      document.getElementById("pendingScreen").classList.add("show");
    });

    socket.on("join-rejected", () => {
      alert("Your join request was rejected.");
      window.location.href = "/";
    });

    socket.on("kicked-from-room", () => {
      alert("You have been removed from the room by the owner.");
      window.location.href = "/";
    });

    socket.on("room-full", () => {
      alert("This room is full (max 2 members).");
      window.location.href = "/";
    });

    // Join request (for owner)
    socket.on("join-request", (request) => {
      const requestsPanel = document.getElementById("joinRequests");
      const requestsList = document.getElementById("requestsList");

      requestsPanel.classList.add("show");

      const item = document.createElement("div");
      item.className = "request-item";
      item.id = `request-${request.id}`;
      item.innerHTML = `
        <span class="request-user">👤 ${request.username}</span>
        <div class="request-actions">
          <button class="approve-btn" onclick="approveRequest('${request.id}')">✓ Approve</button>
          <button class="reject-btn" onclick="rejectRequest('${request.id}')">✕ Reject</button>
        </div>
      `;
      requestsList.appendChild(item);
    });

    function approveRequest(userId) {
      socket.emit("approve-join-request", { roomId, userId });
      document.getElementById(`request-${userId}`).remove();
      if (document.getElementById("requestsList").children.length === 0) {
        document.getElementById("joinRequests").classList.remove("show");
      }
    }

    function rejectRequest(userId) {
      socket.emit("reject-join-request", { roomId, userId });
      document.getElementById(`request-${userId}`).remove();
      if (document.getElementById("requestsList").children.length === 0) {
        document.getElementById("joinRequests").classList.remove("show");
      }
    }

    function cancelJoinRequest() {
      window.location.href = "/";
    }

    // Room members
    socket.on("room-members", (data) => {
      const members = data.members;
      ownerId = data.ownerId;
      isOwner = socket.id === ownerId;

      const bar = document.getElementById("membersBar");
      let html = '<span class="members-label">Members:</span>';

      if (members.length === 0) {
        html += '<span class="waiting-text">Waiting for others...</span>';
      } else {
        members.forEach(member => {
          const isMe = member.id === socket.id;
          const isMemberOwner = member.id === ownerId;
          const statusClass = member.isOnline ? 'online' : '';
          const ownerClass = isMemberOwner ? 'owner' : '';
          const youClass = isMe ? 'you' : '';

          let label = member.username;
          if (isMe) label += ' (You)';
          if (isMemberOwner) label = '👑 ' + label;

          html += `
            <div class="member-chip ${ownerClass} ${youClass}">
              <span class="member-status ${statusClass}"></span>
              <span>${label}</span>
              ${isOwner && !isMe ? `<button class="kick-btn" onclick="kickUser('${member.id}')">Kick</button>` : ''}
            </div>
          `;
        });

        if (members.length < 2) {
          html += '<span class="waiting-text">+ Waiting for 1 more...</span>';
        }
      }

      bar.innerHTML = html;
    });

    function kickUser(userId) {
      if (confirm("Are you sure you want to kick this user?")) {
        socket.emit("kick-user", { roomId, userId });
      }
    }

    // Message history
    socket.on("message-history", (messages) => {
      messages.forEach(msg => {
        const msgId = msg.id || (msg.timestamp + '_' + msg.sender);
        if (loadedMessageIds.has(msgId)) return;
        loadedMessageIds.add(msgId);

        if (msg.type === 'text') {
          displayMessage(msg);
        } else if (msg.type === 'image') {
          displayImage(msg);
        }
      });
      scrollToBottom();
      markMessagesAsRead();
    });

    // Chat messages
    socket.on("chat-message", (data) => {
      const msgId = data.id || (data.timestamp + '_' + data.sender);
      if (loadedMessageIds.has(msgId)) return;
      loadedMessageIds.add(msgId);

      messageStatuses[data.id] = data.status || 'sent';
      displayMessage(data);

      // Mark as read if from others
      if (data.sender !== socket.id) {
        markMessagesAsRead();
      }
    });

    // Message status updates
    socket.on("message-delivered", ({ messageId }) => {
      messageStatuses[messageId] = 'delivered';
      updateMessageStatus(messageId, 'delivered');
    });

    socket.on("message-read-receipt", ({ messageId }) => {
      messageStatuses[messageId] = 'read';
      updateMessageStatus(messageId, 'read');
    });

    function updateMessageStatus(messageId, status) {
      const statusEl = document.querySelector(`[data-msg-id="${messageId}"] .message-status`);
      if (statusEl) {
        statusEl.innerHTML = getStatusTick(status);
      }
    }

    function getStatusTick(status) {
      switch (status) {
        case 'sent':
          return '<span class="tick sent">✓</span>';
        case 'delivered':
          return '<span class="tick delivered">✓✓</span>';
        case 'read':
          return '<span class="tick read">✓✓</span>';
        default:
          return '';
      }
    }

    function markMessagesAsRead() {
      const unreads = [];
      document.querySelectorAll('[data-msg-id]').forEach(el => {
        const msgId = el.dataset.msgId;
        const sender = el.dataset.sender;
        if (sender !== socket.id) {
          unreads.push(msgId);
        }
      });
      if (unreads.length > 0) {
        socket.emit("message-read", { roomId, messageIds: unreads });
      }
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    // Send message
    function sendMessage() {
      const input = document.getElementById("msg");
      const message = input.value.trim();
      if (!message) return;

      socket.emit("chat-message", { roomId, message });
      input.value = "";
      socket.emit("typing", { roomId, isTyping: false });
    }

    // Quick reaction emojis
    const quickReactions = ['👍', '❤️', '😂', '😮', '😢', '🔥'];

    // Store reactions for each message
    const messageReactions = {};

    function displayMessage(data) {
      const isMe = data.sender === socket.id;

      const group = document.createElement("div");
      group.className = `message-group ${isMe ? 'me' : 'other'}`;
      group.dataset.msgId = data.id;
      group.dataset.sender = data.sender;

      if (!isMe && data.username) {
        const nameDiv = document.createElement("div");
        nameDiv.className = "sender-name";
        nameDiv.innerText = data.username;
        group.appendChild(nameDiv);
      }

      // Message wrapper for reactions
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${isMe ? 'me' : 'other'}`;

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isMe ? 'me' : 'other'}`;
      msgDiv.innerText = data.message;
      wrapper.appendChild(msgDiv);

      // Reaction trigger button
      const reactionTrigger = document.createElement("span");
      reactionTrigger.className = "reaction-trigger";
      reactionTrigger.innerText = "😀";
      reactionTrigger.onclick = (e) => {
        e.stopPropagation();
        toggleReactionPicker(data.id);
      };
      wrapper.appendChild(reactionTrigger);

      // Reaction picker
      const reactionPicker = document.createElement("div");
      reactionPicker.className = "reaction-picker";
      reactionPicker.id = `reaction-picker-${data.id}`;
      quickReactions.forEach(emoji => {
        const span = document.createElement("span");
        span.innerText = emoji;
        span.onclick = (e) => {
          e.stopPropagation();
          addReaction(data.id, emoji);
          reactionPicker.classList.remove("show");
        };
        reactionPicker.appendChild(span);
      });
      wrapper.appendChild(reactionPicker);

      // Reactions container
      const reactionsContainer = document.createElement("div");
      reactionsContainer.className = "reactions-container";
      reactionsContainer.id = `reactions-${data.id}`;
      wrapper.appendChild(reactionsContainer);

      // Initialize reactions from data if present
      if (data.reactions) {
        messageReactions[data.id] = data.reactions;
        renderReactions(data.id);
      }

      group.appendChild(wrapper);

      // Add message meta (time + status)
      if (isMe) {
        const metaDiv = document.createElement("div");
        metaDiv.className = "message-meta";

        const time = new Date(data.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        metaDiv.innerHTML = `
          <span class="message-time">${time}</span>
          <span class="message-status">${getStatusTick(data.status || 'sent')}</span>
        `;
        group.appendChild(metaDiv);
      }

      // Insert before typing indicator
      chat.insertBefore(group, typingIndicator);
      scrollToBottom();
    }

    function toggleReactionPicker(messageId) {
      // Close all other pickers
      document.querySelectorAll('.reaction-picker.show').forEach(el => {
        if (el.id !== `reaction-picker-${messageId}`) {
          el.classList.remove('show');
        }
      });

      const picker = document.getElementById(`reaction-picker-${messageId}`);
      if (picker) {
        picker.classList.toggle('show');
      }
    }

    function addReaction(messageId, emoji) {
      // Check if already reacted with this emoji
      if (messageReactions[messageId] && messageReactions[messageId][emoji]) {
        const myReaction = messageReactions[messageId][emoji].find(r => r.userId === socket.id);
        if (myReaction) {
          // Remove reaction
          socket.emit("remove-reaction", { roomId, messageId, emoji });
          return;
        }
      }

      socket.emit("add-reaction", { roomId, messageId, emoji });
    }

    function renderReactions(messageId) {
      const container = document.getElementById(`reactions-${messageId}`);
      if (!container) return;

      container.innerHTML = '';
      const reactions = messageReactions[messageId] || {};

      Object.keys(reactions).forEach(emoji => {
        const users = reactions[emoji];
        if (users.length === 0) return;

        const isMyReaction = users.some(u => u.userId === socket.id);
        const userNames = users.map(u => u.username).join(', ');

        const badge = document.createElement("div");
        badge.className = `reaction-badge ${isMyReaction ? 'mine' : ''}`;
        badge.innerHTML = `
          <span class="emoji">${emoji}</span>
          <span class="count">${users.length}</span>
          <span class="reaction-tooltip">${userNames}</span>
        `;
        badge.onclick = () => addReaction(messageId, emoji);
        container.appendChild(badge);
      });
    }

    // Handle reaction events from server
    socket.on("reaction-added", ({ messageId, emoji, userId, username }) => {
      if (!messageReactions[messageId]) messageReactions[messageId] = {};
      if (!messageReactions[messageId][emoji]) messageReactions[messageId][emoji] = [];

      // Don't add duplicate
      if (!messageReactions[messageId][emoji].find(r => r.userId === userId)) {
        messageReactions[messageId][emoji].push({ userId, username });
      }

      renderReactions(messageId);
    });

    socket.on("reaction-removed", ({ messageId, emoji, userId }) => {
      if (messageReactions[messageId] && messageReactions[messageId][emoji]) {
        messageReactions[messageId][emoji] = messageReactions[messageId][emoji].filter(r => r.userId !== userId);
        if (messageReactions[messageId][emoji].length === 0) {
          delete messageReactions[messageId][emoji];
        }
      }

      renderReactions(messageId);
    });

    // Close reaction pickers when clicking outside
    document.addEventListener('click', () => {
      document.querySelectorAll('.reaction-picker.show').forEach(el => {
        el.classList.remove('show');
      });
    });

    // Typing indicator
    let isTyping = false;

    document.getElementById("msg").addEventListener("input", (e) => {
      if (!isTyping) {
        isTyping = true;
        socket.emit("typing", { roomId, isTyping: true });
      }

      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        isTyping = false;
        socket.emit("typing", { roomId, isTyping: false });
      }, 1500);

      // Auto-convert emoji shortcodes
      const input = e.target;
      const text = input.value;
      const shortcodePattern = /:[a-zA-Z0-9_+-]+:/g;
      let newText = text;
      let match;

      while ((match = shortcodePattern.exec(text)) !== null) {
        const shortcode = match[0].toLowerCase();
        if (emojiShortcodes[shortcode]) {
          newText = newText.replace(match[0], emojiShortcodes[shortcode]);
        }
      }

      if (newText !== text) {
        input.value = newText;
      }
    });

    socket.on("user-typing", ({ userId, username, isTyping: typing }) => {
      if (userId === socket.id) return;

      if (typing) {
        typingText.innerText = `${username} is typing...`;
        typingIndicator.classList.add("show");
      } else {
        typingIndicator.classList.remove("show");
      }
    });

    // Images
    function pickImage() {
      document.getElementById("imageInput").click();
    }

    function generateId() {
      return "img_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    }

    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function () {
        socket.emit("send-image", {
          roomId,
          image: reader.result,
          imageId: generateId()
        });
      };
      reader.readAsDataURL(file);
      this.value = "";
    });

    socket.on("receive-image", (data) => {
      const msgId = data.timestamp + '_' + data.sender;
      if (loadedMessageIds.has(msgId)) return;
      loadedMessageIds.add(msgId);
      displayImage(data);
    });

    function displayImage(data) {
      const isMe = data.sender === socket.id;
      const msgId = data.imageId;

      const group = document.createElement("div");
      group.className = `message-group ${isMe ? 'me' : 'other'}`;
      group.dataset.id = msgId;
      group.dataset.msgId = msgId;

      if (!isMe && data.username) {
        const nameDiv = document.createElement("div");
        nameDiv.className = "sender-name";
        nameDiv.innerText = data.username;
        group.appendChild(nameDiv);
      }

      // Message wrapper for reactions
      const wrapper = document.createElement("div");
      wrapper.className = `message-wrapper ${isMe ? 'me' : 'other'}`;

      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${isMe ? 'me' : 'other'}`;

      const img = document.createElement("img");
      img.src = data.image;
      msgDiv.appendChild(img);

      if (isMe) {
        const delBtn = document.createElement("button");
        delBtn.className = "delete-img-btn";
        delBtn.innerText = "Delete";
        delBtn.onclick = () => {
          socket.emit("delete-image", { roomId, imageId: data.imageId });
        };
        msgDiv.appendChild(delBtn);
      }

      wrapper.appendChild(msgDiv);

      // Reaction trigger button
      const reactionTrigger = document.createElement("span");
      reactionTrigger.className = "reaction-trigger";
      reactionTrigger.innerText = "😀";
      reactionTrigger.onclick = (e) => {
        e.stopPropagation();
        toggleReactionPicker(msgId);
      };
      wrapper.appendChild(reactionTrigger);

      // Reaction picker
      const reactionPicker = document.createElement("div");
      reactionPicker.className = "reaction-picker";
      reactionPicker.id = `reaction-picker-${msgId}`;
      quickReactions.forEach(emoji => {
        const span = document.createElement("span");
        span.innerText = emoji;
        span.onclick = (e) => {
          e.stopPropagation();
          addReaction(msgId, emoji);
          reactionPicker.classList.remove("show");
        };
        reactionPicker.appendChild(span);
      });
      wrapper.appendChild(reactionPicker);

      // Reactions container
      const reactionsContainer = document.createElement("div");
      reactionsContainer.className = "reactions-container";
      reactionsContainer.id = `reactions-${msgId}`;
      wrapper.appendChild(reactionsContainer);

      group.appendChild(wrapper);
      chat.insertBefore(group, typingIndicator);
      scrollToBottom();
    }

    socket.on("remove-image", (imageId) => {
      const el = chat.querySelector(`[data-id='${imageId}']`);
      if (el) el.remove();
    });

    // Enter to send
    document.getElementById("msg").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // Emoji picker
    const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '😘', '🥰', '😗', '😙', '🥲', '😚', '☺️', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '🥱', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '🥴', '😠', '😡', '🤬', '😷', '🤒', '🤕', '🤢', '🤮', '🤧', '😇', '🥳', '🥺', '🤠', '🤡', '🤥', '🤫', '🤭', '🧐', '🤓', '😈', '👿', '👋', '🤚', '🖐️', '✋', '🖖', '👌', '🤌', '🤏', '✌️', '🤞', '🤟', '🤘', '🤙', '👈', '👉', '👆', '🖕', '👇', '☝️', '👍', '👎', '✊', '👊', '🤛', '🤜', '👏', '🙌', '👐', '🤲', '🤝', '🙏', '✍️', '💪', '🦾', '❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💘', '💝', '💟'];
    const stickers = ['🎉', '🎊', '🎈', '🎁', '🏆', '⭐', '🌟', '✨', '💫', '🔥', '💥', '💯', '🎯', '🚀', '💎', '👑', '🦄', '🐱', '🐶', '🐼', '🦊', '🦁', '🐯', '🐸', '🐵', '🙈', '🙉', '🙊', '💀', '👻', '👽', '🤖', '💩', '🎃', '🌈', '☀️', '🌙', '⚡', '❄️', '🌊', '🌸', '🌺', '🍀', '🍕', '🍔', '🍟', '🍩', '🍪', '🎂', '🍰', '☕', '🍺', '🥂', '🎵', '🎶', '🎸', '🎮', '🎲', '⚽', '🏀', '🎾', '🏈'];

    const emojiShortcodes = {
      ':smile:': '😀', ':grin:': '😁', ':joy:': '😂', ':rofl:': '🤣', ':smiley:': '😃',
      ':happy:': '😄', ':sweat_smile:': '😅', ':laughing:': '😆', ':wink:': '😉', ':blush:': '😊',
      ':yum:': '😋', ':sunglasses:': '😎', ':heart_eyes:': '😍', ':kiss:': '😘', ':love:': '🥰',
      ':thinking:': '🤔', ':thumbsup:': '👍', ':thumbs_up:': '👍', ':+1:': '👍', ':thumbsdown:': '👎',
      ':heart:': '❤️', ':fire:': '🔥', ':100:': '💯', ':star:': '⭐', ':sparkles:': '✨',
      ':rocket:': '🚀', ':party:': '🥳', ':wave:': '👋', ':clap:': '👏', ':pray:': '🙏',
      ':muscle:': '💪', ':ok:': '👌', ':v:': '✌️', ':fist:': '✊', ':cry:': '😢',
      ':sob:': '😭', ':angry:': '😠', ':rage:': '😡', ':cool:': '😎', ':sad:': '😢'
    };

    const emojiGrid = document.getElementById('emojis');
    const stickerGrid = document.getElementById('stickers');
    const emojiPicker = document.getElementById('emojiPicker');

    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'emoji-item';
      span.innerText = emoji;
      span.onclick = () => insertEmoji(emoji);
      emojiGrid.appendChild(span);
    });

    stickers.forEach(sticker => {
      const span = document.createElement('span');
      span.className = 'sticker-item';
      span.innerText = sticker;
      span.onclick = () => sendSticker(sticker);
      stickerGrid.appendChild(span);
    });

    function toggleEmojiPicker() {
      emojiPicker.classList.toggle('show');
    }

    function showTab(tab) {
      document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('emojis').style.display = tab === 'emojis' ? 'grid' : 'none';
      document.getElementById('stickers').style.display = tab === 'stickers' ? 'grid' : 'none';
      document.getElementById('gifs').style.display = tab === 'gifs' ? 'grid' : 'none';
    }

    function insertEmoji(emoji) {
      document.getElementById('msg').value += emoji;
      document.getElementById('msg').focus();
    }

    function sendSticker(sticker) {
      socket.emit("chat-message", { roomId, message: sticker });
      emojiPicker.classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.emoji-picker') && !e.target.closest('.input-btn')) {
        emojiPicker.classList.remove('show');
      }
    });

    // GIFs
    const gifs = [
      'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
      'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',
      'https://media.giphy.com/media/3o7TKSjRrfIPjeiVyg/giphy.gif',
      'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
      'https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif',
      'https://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif'
    ];

    const gifGrid = document.getElementById('gifs');
    gifs.forEach(gif => {
      const img = document.createElement('img');
      img.className = 'gif-item';
      img.src = gif;
      img.onclick = () => {
        socket.emit("send-image", { roomId, image: gif, imageId: generateId() });
        emojiPicker.classList.remove('show');
      };
      gifGrid.appendChild(img);
    });

    // WebRTC
    let localStream = null;
    let peerConnection = null;
    let isMuted = true;
    let isVideoOff = false;
    let pendingCallData = null;

    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startCall(withVideo) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: withVideo
        });

        localStream.getAudioTracks().forEach(track => track.enabled = false);
        isMuted = true;
        document.getElementById('muteBtn').classList.add('active');

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');
        document.getElementById('callStatus').innerText = 'Calling...';

        if (!withVideo) {
          document.getElementById('localVideo').style.display = 'none';
          document.getElementById('videoBtn').style.display = 'none';
        } else {
          document.getElementById('localVideo').style.display = 'block';
          document.getElementById('videoBtn').style.display = 'flex';
        }

        createPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { roomId, offer, isVideoCall: withVideo });
      } catch (err) {
        console.error('Error starting call:', err);
        alert('Could not access camera/microphone');
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(config);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        document.getElementById('callStatus').innerText = 'Connected';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { roomId, candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected') {
          endCall();
        }
      };
    }

    socket.on('call-made', async (data) => {
      pendingCallData = data;
      document.getElementById('incomingCallIcon').innerText = data.isVideoCall ? '📹' : '🎤';
      document.getElementById('incomingCallType').innerText = data.isVideoCall ? 'Video Call' : 'Voice Call';
      document.getElementById('incomingCallModal').classList.add('active');
    });

    async function acceptIncomingCall() {
      if (!pendingCallData) return;
      const data = pendingCallData;
      document.getElementById('incomingCallModal').classList.remove('active');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: data.isVideoCall
        });

        localStream.getAudioTracks().forEach(track => track.enabled = false);
        isMuted = true;
        document.getElementById('muteBtn').classList.add('active');

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');

        if (!data.isVideoCall) {
          document.getElementById('localVideo').style.display = 'none';
          document.getElementById('videoBtn').style.display = 'none';
        } else {
          document.getElementById('localVideo').style.display = 'block';
          document.getElementById('videoBtn').style.display = 'flex';
        }

        createPeerConnection();

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('make-answer', { roomId, answer });
        document.getElementById('callStatus').innerText = 'Connected';
      } catch (err) {
        console.error('Error answering call:', err);
        alert('Could not access camera/microphone');
      }
      pendingCallData = null;
    }

    function rejectIncomingCall() {
      document.getElementById('incomingCallModal').classList.remove('active');
      socket.emit('call-rejected', { roomId });
      pendingCallData = null;
    }

    socket.on('answer-made', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById('callStatus').innerText = 'Connected';
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('call-rejected', () => {
      alert('Call was rejected');
      endCall();
    });

    socket.on('call-ended', endCall);

    function toggleMute() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        document.getElementById('muteBtn').classList.toggle('active', isMuted);
      }
    }

    function toggleVideo() {
      if (localStream) {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
        document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
      }
    }

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('callOverlay').classList.remove('active');
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = null;
      socket.emit('end-call', { roomId });
    }
  </script>

</body>

</html>
