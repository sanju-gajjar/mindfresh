<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chat Room</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2d3a8c;
      color: white;
      padding: 12px 18px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .connection-status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1cc88a;
    }

    .connection-status.disconnected {
      background: #e74a3b;
      animation: blink 1s infinite;
    }

    .connection-status.reconnecting {
      background: #f6c23e;
      animation: blink 0.5s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    .header-buttons {
      display: flex;
      gap: 8px;
    }

    .call-btn {
      background: #1cc88a;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .call-btn.video {
      background: #4e73df;
    }

    .call-btn.end {
      background: #e74a3b;
    }

    .chat-area {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 18px;
      margin-bottom: 10px;
      font-size: 14px;
      word-wrap: break-word;
    }

    .me {
      background: #4e73df;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .other {
      background: #333;
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .message img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 5px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #333;
      background: #1a1a1a;
    }

    .input-area input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 14px;
      margin-right: 8px;
    }

    .input-area input[type="text"]::placeholder {
      color: #888;
    }

    .send-btn {
      background: #1cc88a;
      border: none;
      color: white;
      padding: 0 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .file-btn {
      background: #858796;
      border: none;
      color: white;
      padding: 0 12px;
      border-radius: 20px;
      margin-right: 8px;
      cursor: pointer;
    }

    .emoji-btn {
      background: #f6c23e;
      border: none;
      color: #333;
      padding: 0 12px;
      border-radius: 20px;
      margin-right: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .emoji-picker {
      position: absolute;
      bottom: 60px;
      left: 10px;
      right: 10px;
      background: #2a2a2a;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      display: none;
      max-height: 250px;
      overflow-y: auto;
      z-index: 100;
    }

    .emoji-picker.show {
      display: block;
    }

    .emoji-tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      border-bottom: 1px solid #444;
      padding-bottom: 8px;
    }

    .emoji-tab {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }

    .emoji-tab.active {
      background: #4e73df;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
    }

    .emoji-item {
      font-size: 22px;
      padding: 5px;
      text-align: center;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .emoji-item:hover {
      background: #444;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .sticker-item {
      font-size: 40px;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .sticker-item:hover {
      background: #444;
    }

    .input-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }

    .gif-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .gif-item {
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gif-item:hover {
      transform: scale(1.05);
    }

    /* Video Call Overlay */
    .call-overlay {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #000;
      z-index: 1000;
      display: none;
      flex-direction: column;
    }

    .call-overlay.active {
      display: flex;
    }

    .video-container {
      flex: 1;
      position: relative;
      background: #1a1a1a;
    }

    .remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #333;
    }

    .local-video {
      position: absolute;
      bottom: 100px;
      right: 15px;
      width: 120px;
      height: 160px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
      border: 2px solid #fff;
    }

    .call-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-btn.mute {
      background: #333;
      color: white;
    }

    .control-btn.mute.active {
      background: #e74a3b;
    }

    .control-btn.video-toggle {
      background: #333;
      color: white;
    }

    .control-btn.video-toggle.active {
      background: #e74a3b;
    }

    .control-btn.end-call {
      background: #e74a3b;
      color: white;
    }

    .call-status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 16px;
      border-radius: 20px;
    }

    /* Incoming Call Modal */
    .incoming-call-modal {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1002;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .incoming-call-modal.active {
      display: flex;
    }

    .incoming-call-content {
      text-align: center;
      color: white;
    }

    .incoming-call-content h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .incoming-call-content p {
      font-size: 16px;
      opacity: 0.8;
      margin-bottom: 30px;
    }

    .incoming-call-icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .incoming-call-buttons {
      display: flex;
      gap: 30px;
    }

    .incoming-call-buttons button {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 28px;
    }

    .accept-call {
      background: #1cc88a;
      color: white;
    }

    .reject-call {
      background: #e74a3b;
      color: white;
    }

    button:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="header-left">
        <div class="connection-status" id="connectionStatus" title="Connected"></div>
        <span>Room: <span id="roomCode"></span></span>
      </div>
      <div class="header-buttons">
        <button class="call-btn" onclick="startCall(false)" title="Voice Call">🎤</button>
        <button class="call-btn video" onclick="startCall(true)" title="Video Call">📹</button>
      </div>
    </div>

    <div class="chat-area" id="chat"></div>

    <div class="input-area">
      <input type="file" id="imageInput" accept="image/*,image/gif" hidden>
      <button class="file-btn" onclick="pickImage()">+</button>
      <button class="emoji-btn" onclick="toggleEmojiPicker()">😊</button>
      <div class="input-wrapper">
        <div class="emoji-picker" id="emojiPicker">
          <div class="emoji-tabs">
            <button class="emoji-tab active" onclick="showTab('emojis')">😀 Emoji</button>
            <button class="emoji-tab" onclick="showTab('stickers')">🎉 Stickers</button>
            <button class="emoji-tab" onclick="showTab('gifs')">GIF</button>
          </div>
          <div id="emojis" class="emoji-grid"></div>
          <div id="stickers" class="sticker-grid" style="display:none;"></div>
          <div id="gifs" class="gif-grid" style="display:none;"></div>
        </div>
        <input type="text" id="msg" placeholder="Type message..." style="width:100%;" />
      </div>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

  </div>

  <!-- Video Call Overlay -->
  <div class="call-overlay" id="callOverlay">
    <div class="video-container">
      <video class="remote-video" id="remoteVideo" autoplay playsinline></video>
      <video class="local-video" id="localVideo" autoplay playsinline muted></video>
      <div class="call-status" id="callStatus">Calling...</div>
      <div class="call-controls">
        <button class="control-btn mute active" id="muteBtn" onclick="toggleMute()">🎤</button>
        <button class="control-btn video-toggle" id="videoBtn" onclick="toggleVideo()">📹</button>
        <button class="control-btn end-call" onclick="endCall()">📞</button>
      </div>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div class="incoming-call-modal" id="incomingCallModal">
    <div class="incoming-call-content">
      <div class="incoming-call-icon" id="incomingCallIcon">📹</div>
      <h2>Incoming Call</h2>
      <p id="incomingCallType">Video Call</p>
      <div class="incoming-call-buttons">
        <button class="reject-call" onclick="rejectIncomingCall()">📞</button>
        <button class="accept-call" onclick="acceptIncomingCall()">📞</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      reconnection: true,
      reconnectionAttempts: Infinity,
      reconnectionDelay: 1000,
      reconnectionDelayMax: 5000
    });
    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room");
    const chat = document.getElementById("chat");
    const connectionStatus = document.getElementById("connectionStatus");
    let loadedMessageIds = new Set();

    document.getElementById("roomCode").innerText = roomId;

    // Connection status handling
    socket.on("connect", () => {
      console.log("Socket connected");
      connectionStatus.className = "connection-status";
      connectionStatus.title = "Connected";
      socket.emit("join-room", roomId);
    });

    socket.on("disconnect", () => {
      console.log("Socket disconnected");
      connectionStatus.className = "connection-status disconnected";
      connectionStatus.title = "Disconnected - Reconnecting...";
    });

    socket.on("reconnecting", () => {
      connectionStatus.className = "connection-status reconnecting";
      connectionStatus.title = "Reconnecting...";
    });

    socket.on("reconnect", () => {
      console.log("Socket reconnected");
      connectionStatus.className = "connection-status";
      connectionStatus.title = "Connected";
    });

    // Load message history
    socket.on("message-history", (messages) => {
      messages.forEach(msg => {
        const msgId = msg.timestamp + '_' + msg.sender;
        if (loadedMessageIds.has(msgId)) return;
        loadedMessageIds.add(msgId);

        if (msg.type === 'text') {
          displayMessage(msg);
        } else if (msg.type === 'image') {
          displayImage(msg);
        }
      });
      scrollToBottom();
    });

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("msg");
      const message = input.value.trim();
      if (!message) return;

      socket.emit("chat-message", { roomId, message });
      input.value = "";
    }

    socket.on("chat-message", (data) => {
      const msgId = data.timestamp + '_' + data.sender;
      if (loadedMessageIds.has(msgId)) return;
      loadedMessageIds.add(msgId);
      displayMessage(data);
    });

    function displayMessage(data) {
      const div = document.createElement("div");
      div.classList.add("message");
      const isMe = data.sender === socket.id;
      div.classList.add(isMe ? "me" : "other");

      if (!isMe && data.username) {
        const nameDiv = document.createElement("div");
        nameDiv.style.fontSize = "11px";
        nameDiv.style.opacity = "0.7";
        nameDiv.style.marginBottom = "4px";
        nameDiv.style.fontWeight = "600";
        nameDiv.innerText = data.username;
        div.appendChild(nameDiv);
      }

      const textDiv = document.createElement("div");
      textDiv.innerText = data.message;
      div.appendChild(textDiv);

      chat.appendChild(div);
      scrollToBottom();
    }

    function pickImage() {
      document.getElementById("imageInput").click();
    }

    function generateId() {
      return "img_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
    }

    // Send image
    document.getElementById("imageInput").addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function () {
        const imageId = generateId();

        socket.emit("send-image", {
          roomId,
          image: reader.result,
          imageId: imageId
        });
      };
      reader.readAsDataURL(file);
      this.value = "";
    });

    // Receive image
    socket.on("receive-image", (data) => {
      const msgId = data.timestamp + '_' + data.sender;
      if (loadedMessageIds.has(msgId)) return;
      loadedMessageIds.add(msgId);
      displayImage(data);
    });

    function displayImage(data) {
      const div = document.createElement("div");
      div.classList.add("message");
      const isMe = data.sender === socket.id;
      div.classList.add(isMe ? "me" : "other");
      div.dataset.id = data.imageId;

      if (!isMe && data.username) {
        const nameDiv = document.createElement("div");
        nameDiv.style.fontSize = "11px";
        nameDiv.style.opacity = "0.7";
        nameDiv.style.marginBottom = "4px";
        nameDiv.style.fontWeight = "600";
        nameDiv.innerText = data.username;
        div.appendChild(nameDiv);
      }

      const img = document.createElement("img");
      img.src = data.image;
      div.appendChild(img);

      if (isMe) {
        const delBtn = document.createElement("button");
        delBtn.innerText = "Delete";
        delBtn.style.marginTop = "6px";
        delBtn.style.background = "#e74a3b";
        delBtn.style.color = "white";
        delBtn.style.border = "none";
        delBtn.style.padding = "6px 12px";
        delBtn.style.borderRadius = "10px";

        delBtn.onclick = function () {
          socket.emit("delete-image", {
            roomId,
            imageId: data.imageId
          });
        };

        div.appendChild(delBtn);
      }

      chat.appendChild(div);
      scrollToBottom();
    }

    // REMOVE IMAGE ON ALL CLIENTS
    socket.on("remove-image", (imageId) => {
      const el = chat.querySelector(`[data-id='${imageId}']`);
      if (el) el.remove();
    });

    // Enter key to send
    document.getElementById("msg").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    // Auto-convert emoji shortcodes (e.g., :smile: → 😀)
    document.getElementById("msg").addEventListener("input", (e) => {
      const input = e.target;
      const text = input.value;
      const shortcodePattern = /:[a-zA-Z0-9_+-]+:/g;
      let newText = text;
      let match;

      while ((match = shortcodePattern.exec(text)) !== null) {
        const shortcode = match[0].toLowerCase();
        if (emojiShortcodes[shortcode]) {
          newText = newText.replace(match[0], emojiShortcodes[shortcode]);
        }
      }

      if (newText !== text) {
        const cursorPos = input.selectionStart;
        const diff = text.length - newText.length;
        input.value = newText;
        input.setSelectionRange(cursorPos - diff, cursorPos - diff);
      }
    });

    // Emoji/Sticker Picker
    const emojis = ['😀', '😁', '😂', '🤣', '😃', '😄', '😅', '😆', '😉', '😊', '😋', '😎', '😍', '😘', '🥰', '😗', '😙', '🥲', '😚', '☺️', '🙂', '🤗', '🤩', '🤔', '🤨', '😐', '😑', '😶', '🙄', '😏', '😣', '😥', '😮', '🤐', '😯', '😪', '😫', '🥱', '😴', '😌', '😛', '😜', '😝', '🤤', '😒', '😓', '😔', '😕', '🙃', '🤑', '😲', '☹️', '🙁', '😖', '😞', '😟', '😤', '😢', '😭', '😦', '😧', '😨', '😩', '🤯', '😬', '😰', '😱', '🥵', '🥶', '😳', '🤪', '😵', '🥴', '😠', '😡', '🤬', '😷', '🤒', '🤕', '🤢', '🤮', '🤧', '😇', '🥳', '🥺', '🤠', '🤡', '🤥', '🤫', '🤭', '🧐', '🤓', '😈', '👿', '👋', '🤚', '🖐️', '✋', '🖖', '👌', '🤌', '🤏', '✌️', '🤞', '🤟', '🤘', '🤙', '👈', '👉', '👆', '🖕', '👇', '☝️', '👍', '👎', '✊', '👊', '🤛', '🤜', '👏', '🙌', '👐', '🤲', '🤝', '🙏', '✍️', '💪', '🦾', '❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '💔', '❣️', '💕', '💞', '💓', '💗', '💖', '💘', '💝', '💟'];
    const stickers = ['🎉', '🎊', '🎈', '🎁', '🏆', '⭐', '🌟', '✨', '💫', '🔥', '💥', '💯', '🎯', '🚀', '💎', '👑', '🦄', '🐱', '🐶', '🐼', '🦊', '🦁', '🐯', '🐸', '🐵', '🙈', '🙉', '🙊', '💀', '👻', '👽', '🤖', '💩', '🎃', '🌈', '☀️', '🌙', '⚡', '❄️', '🌊', '🌸', '🌺', '🍀', '🍕', '🍔', '🍟', '🍩', '🍪', '🎂', '🍰', '☕', '🍺', '🥂', '🎵', '🎶', '🎸', '🎮', '🎲', '⚽', '🏀', '🎾', '🏈', '🍆',
      '🍑',
      '🍒',
      '🍈',
      '🥛',
      '🛥️',
      '🐱',
      '🌮',
      '🐓',
      '🧱',
      '👅',
      '💦',
      '🧬',
      '🥜',
      '🧠',
      '✂️',
      '😈',
      '🥵',
      '🌶️',
      '🍜',
      '🌽',
      '🍍',
      '🪑',
      '🎂',
      '🥞',
      '🚛',
      '🔵',
      '🟠',
      '💊',
      '🍬',
      '🍁',
      '❄️',
      '🎱',
      '🔑',
      '🤥',
      '⚙️'];

    const emojiGrid = document.getElementById('emojis');
    const stickerGrid = document.getElementById('stickers');
    const emojiPicker = document.getElementById('emojiPicker');

    // Emoji shortcode mapping
    const emojiShortcodes = {
      ':smile:': '😀', ':grin:': '😁', ':joy:': '😂', ':rofl:': '🤣', ':smiley:': '😃',
      ':happy:': '😄', ':sweat_smile:': '😅', ':laughing:': '😆', ':wink:': '😉', ':blush:': '😊',
      ':yum:': '😋', ':sunglasses:': '😎', ':heart_eyes:': '😍', ':kiss:': '😘', ':love:': '🥰',
      ':kissing:': '😗', ':thinking:': '🤔', ':neutral:': '😐', ':expressionless:': '😑',
      ':unamused:': '😒', ':rolling_eyes:': '🙄', ':smirk:': '😏', ':relieved:': '😌',

    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'emoji-item';
      span.innerText = emoji;
      span.onclick = () => insertEmoji(emoji);
      emojiGrid.appendChild(span);
    });

    stickers.forEach(sticker => {
      const span = document.createElement('span');
      span.className = 'sticker-item';
      span.innerText = sticker;
      span.onclick = () => sendSticker(sticker);
      stickerGrid.appendChild(span);
    });

    function toggleEmojiPicker() {
      emojiPicker.classList.toggle('show');
    }

    function showTab(tab) {
      document.querySelectorAll('.emoji-tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('emojis').style.display = tab === 'emojis' ? 'grid' : 'none';
      document.getElementById('stickers').style.display = tab === 'stickers' ? 'grid' : 'none';
      document.getElementById('gifs').style.display = tab === 'gifs' ? 'grid' : 'none';
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('msg');
      input.value += emoji;
      input.focus();
    }

    function sendSticker(sticker) {
      socket.emit("chat-message", { roomId, message: sticker });
      emojiPicker.classList.remove('show');
    }

    // Close emoji picker when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.emoji-picker') && !e.target.closest('.emoji-btn')) {
        emojiPicker.classList.remove('show');
      }
    });

    // GIF Support
    const gifs = [
      'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
      'https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif',
      'https://media.giphy.com/media/3o7TKSjRrfIPjeiVyg/giphy.gif',
      'https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif',
      'https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif',
      'https://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif',
      'https://media.giphy.com/media/3oEjI6SIIHBdRxXI40/giphy.gif',
      'https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif',
      'https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif',
      'https://media.giphy.com/media/l4FGGafcOHmrlQxG0/giphy.gif',
      'https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif',
      'https://media.giphy.com/media/26u4cqiYI30juCOGY/giphy.gif'
    ];

    const gifGrid = document.getElementById('gifs');
    gifs.forEach(gif => {
      const img = document.createElement('img');
      img.className = 'gif-item';
      img.src = gif;
      img.onclick = () => sendGif(gif);
      gifGrid.appendChild(img);
    });

    function sendGif(gifUrl) {
      const imageId = generateId();
      socket.emit("send-image", {
        roomId,
        image: gifUrl,
        imageId: imageId
      });
      emojiPicker.classList.remove('show');
    }

    // WebRTC Video/Voice Call
    let localStream = null;
    let peerConnection = null;
    let isMuted = true; // Default muted
    let isVideoOff = false;
    let isVideoCall = false;
    let pendingCallData = null; // Store incoming call data

    const config = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    async function startCall(withVideo) {
      isVideoCall = withVideo;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: withVideo
        });

        // Default muted
        localStream.getAudioTracks().forEach(track => track.enabled = false);
        isMuted = true;
        document.getElementById('muteBtn').classList.add('active');

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');
        document.getElementById('callStatus').innerText = 'Calling...';

        if (!withVideo) {
          document.getElementById('localVideo').style.display = 'none';
          document.getElementById('videoBtn').style.display = 'none';
        } else {
          document.getElementById('localVideo').style.display = 'block';
          document.getElementById('videoBtn').style.display = 'flex';
        }

        createPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { roomId, offer, isVideoCall: withVideo });
      } catch (err) {
        console.error('Error starting call:', err);
        alert('Could not access camera/microphone');
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(config);

      localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        document.getElementById('callStatus').innerText = 'Connected';
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { roomId, candidate: event.candidate });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (peerConnection.connectionState === 'disconnected') {
          endCall();
        }
      };
    }

    socket.on('call-made', async (data) => {
      // Store call data and show incoming call modal
      pendingCallData = data;
      document.getElementById('incomingCallIcon').innerText = data.isVideoCall ? '📹' : '🎤';
      document.getElementById('incomingCallType').innerText = data.isVideoCall ? 'Video Call' : 'Voice Call';
      document.getElementById('incomingCallModal').classList.add('active');
    });

    async function acceptIncomingCall() {
      if (!pendingCallData) return;
      const data = pendingCallData;
      document.getElementById('incomingCallModal').classList.remove('active');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: data.isVideoCall
        });

        // Default muted
        localStream.getAudioTracks().forEach(track => track.enabled = false);
        isMuted = true;
        document.getElementById('muteBtn').classList.add('active');

        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').classList.add('active');

        if (!data.isVideoCall) {
          document.getElementById('localVideo').style.display = 'none';
          document.getElementById('videoBtn').style.display = 'none';
        } else {
          document.getElementById('localVideo').style.display = 'block';
          document.getElementById('videoBtn').style.display = 'flex';
        }

        createPeerConnection();

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('make-answer', { roomId, answer });
        document.getElementById('callStatus').innerText = 'Connected';
      } catch (err) {
        console.error('Error answering call:', err);
        alert('Could not access camera/microphone');
      }
      pendingCallData = null;
    }

    function rejectIncomingCall() {
      document.getElementById('incomingCallModal').classList.remove('active');
      socket.emit('call-rejected', { roomId });
      pendingCallData = null;
    }

    socket.on('answer-made', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      document.getElementById('callStatus').innerText = 'Connected';
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
      }
    });

    socket.on('call-rejected', () => {
      alert('Call was rejected');
      endCall();
    });

    socket.on('call-ended', () => {
      endCall();
    });

    function toggleMute() {
      if (localStream) {
        isMuted = !isMuted;
        localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);
        document.getElementById('muteBtn').classList.toggle('active', isMuted);
      }
    }

    function toggleVideo() {
      if (localStream) {
        isVideoOff = !isVideoOff;
        localStream.getVideoTracks().forEach(track => track.enabled = !isVideoOff);
        document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
      }
    }

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('callOverlay').classList.remove('active');
      document.getElementById('remoteVideo').srcObject = null;
      document.getElementById('localVideo').srcObject = null;
      socket.emit('end-call', { roomId });
    }

  </script>
